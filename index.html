<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grid Bot — USDT/IRT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#eef1f7;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:27px;margin:0}.badge{padding:7px 12px;border-radius:18px;background:#242a38;color:#aab4c9}
.card{background:#101521;border:1px solid #20283a;border-radius:20px;padding:18px;margin-top:14px}
.price{font-size:38px;font-weight:800;margin:8px 0}.muted{color:#8e9ab0}.ok{color:#43d17c}.err{color:#ff647c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0b101a;border-radius:14px;padding:14px}.stat b{display:block;font-size:18px;margin-top:5px}
label{display:block;color:#9da8bc;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #293247;background:#080c14;color:white;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:13px;background:#5865f2;color:#fff;font-size:16px;font-weight:700;margin-top:12px}
.small{font-size:12px;line-height:1.8}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1d2432}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>GRID BOT</h1><div class="muted">نسخه وب موبایل • USDT / IRT</div></div><div class="badge">PAPER</div></div>

  <div class="card">
    <div class="muted">قیمت زنده والکس</div>
    <div id="price" class="price">در حال دریافت...</div>
    <div id="status" class="muted">در حال اتصال به Backend...</div>
    <div class="grid" style="margin-top:12px">
      <div class="stat"><span class="muted">Bid</span><b id="bid">—</b></div>
      <div class="stat"><span class="muted">Ask</span><b id="ask">—</b></div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="stat"><span class="muted">سرمایه</span><b id="capitalView">10,000,000 تومان</b></div>
      <div class="stat"><span class="muted">تعداد گرید</span><b id="gridView">10</b></div>
    </div>
    <label>قیمت کف</label><input id="floor" type="number" value="95000">
    <label>قیمت سقف</label><input id="ceiling" type="number" value="105000">
    <label>تعداد گرید</label><input id="grids" type="number" value="10" min="2" max="100">
    <label>سرمایه (تومان)</label><input id="capital" type="number" value="10000000">
    <button onclick="recalc()">محاسبه گرید</button>
  </div>

  <div class="card">
    <div class="muted">وضعیت اتصال</div>
    <div id="endpoint" class="small" style="direction:ltr;text-align:left;word-break:break-all"></div>
    <div class="small muted">این نسخه فقط قیمت عمومی را می‌خواند و هیچ سفارش واقعی ارسال نمی‌کند.</div>
  </div>
</div>

<script>
// بعد از ساخت Cloudflare Worker، فقط این آدرس را عوض کن:
const BACKEND_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE/api/price";

const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 0});

async function loadPrice(){
  const priceEl=document.getElementById("price");
  const status=document.getElementById("status");
  if(BACKEND_URL.includes("PASTE_YOUR")){
    status.innerHTML='<span class="err">آدرس Backend هنوز وارد نشده است</span>';
    return;
  }
  try{
    const r=await fetch(BACKEND_URL,{cache:"no-store"});
    const d=await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error || "Backend error");
    priceEl.textContent=fmt(d.lastPrice)+" تومان";
    document.getElementById("bid").textContent=fmt(d.bidPrice);
    document.getElementById("ask").textContent=fmt(d.askPrice);
    status.innerHTML='<span class="ok">● قیمت زنده والکس دریافت شد</span>';
  }catch(e){
    status.innerHTML='<span class="err">● خطا در دریافت قیمت: '+(e.message||e)+'</span>';
  }
}

function recalc(){
  const floor=Number(document.getElementById("floor").value);
  const ceiling=Number(document.getElementById("ceiling").value);
  const grids=Number(document.getElementById("grids").value);
  const capital=Number(document.getElementById("capital").value);
  if(!(ceiling>floor)||grids<2)return;
  document.getElementById("capitalView").textContent=fmt(capital)+" تومان";
  document.getElementById("gridView").textContent=grids;
}
recalc();
loadPrice();
setInterval(loadPrice,5000);
</script>

<section class="card" style="margin-top:14px">
<h3 style="margin:0 0 4px">📈 نمودار زنده گرید</h3>
<div class="muted" style="font-size:12px;margin-bottom:10px">قیمت USDT/IRT + خطوط گرید + نقاط BUY و SELL</div>
<div style="height:330px;position:relative"><canvas id="gridChart"></canvas></div>
<div id="tradeSignals" class="small" style="margin-top:12px"></div>
</section>
<script>
(function(){
let chart=null,history=[],signals=[],prev=null;
const N=v=>{let x=Number(v);return Number.isFinite(x)?x:null};
function P(){let e=document.getElementById('price');if(!e)return null;let x=N((e.textContent||'').replace(/[^\d.]/g,''));return x>0?x:null}
function L(){let f=N(document.getElementById('floor')?.value),c=N(document.getElementById('ceiling')?.value),g=Math.max(2,parseInt(document.getElementById('grids')?.value||10));return c>f?Array.from({length:g+1},(_,i)=>f+(c-f)*i/g):[]}
function cross(a,b,ls){if(a==null||a===b)return[];let z=[];ls.forEach((v,i)=>{if(b<a&&v<a&&v>=b)z.push({v,i,s:'BUY'});if(b>a&&v>a&&v<=b)z.push({v,i,s:'SELL'})});return z}
function draw(){
if(typeof Chart==='undefined')return;let p=P(),ls=L();
if(p){cross(prev,p,ls).forEach(x=>signals.push({p:x.v,i:x.i,s:x.s,t:new Date().toLocaleTimeString('fa-IR')}));prev=p;history.push({t:new Date().toLocaleTimeString('fa-IR'),p});if(history.length>120)history.shift();if(signals.length>40)signals=signals.slice(-40)}
let labels=history.map(x=>x.t),ds=[{label:'قیمت USDT/IRT',data:history.map(x=>x.p),borderWidth:3,pointRadius:0,tension:.2}];
ls.forEach((v,i)=>ds.push({label:'گرید '+(i+1),data:labels.map(()=>v),borderWidth:1,pointRadius:0,borderDash:[5,5]}));
let buys=[],sells=[];signals.forEach(s=>{let k=history.map(h=>h.t).lastIndexOf(s.t);if(k>=0)(s.s==='BUY'?buys:sells).push({x:k,y:s.p})});
if(buys.length)ds.push({type:'scatter',label:'🟢 BUY',data:buys,pointRadius:8});
if(sells.length)ds.push({type:'scatter',label:'🔴 SELL',data:sells,pointRadius:8});
let c=document.getElementById('gridChart');if(!c)return;if(chart)chart.destroy();
chart=new Chart(c,{type:'line',data:{labels:labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:ls.length<=12,position:'bottom',labels:{boxWidth:12,font:{size:9}}}},scales:{x:{ticks:{maxTicksLimit:6}},y:{ticks:{callback:v=>Number(v).toLocaleString('en-US')}}}}});
let e=document.getElementById('tradeSignals');e.innerHTML=signals.length?signals.slice().reverse().slice(0,8).map(s=>'<div class="line"><span>'+(s.s==='BUY'?'🟢 BUY':'🔴 SELL')+' — گرید '+(s.i+1)+'</span><b>'+Math.round(s.p).toLocaleString('en-US')+'</b></div>').join(''):'<span class="muted">هنوز سیگنال گرید ثبت نشده است.</span>';
}
setInterval(draw,2000);setTimeout(draw,800);
})();
</script>

</body>
</html>
